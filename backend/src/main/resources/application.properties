spring.application.name=ewallet

server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=never

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Required environment value. Use at least 32 random bytes for HS256.
jwt.secret=${JWT_SECRET:}
jwt.expiration-seconds=${JWT_EXPIRATION:3600}

frontend.base-url=${FRONTEND_BASE_URL}
mail.development-log-enabled=${MAIL_DEVELOPMENT_LOG_ENABLED:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
account-token.verification-minutes=${EMAIL_VERIFICATION_MINUTES:1440}
account-token.reset-minutes=${PASSWORD_RESET_MINUTES:30}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

