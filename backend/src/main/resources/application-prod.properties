mail.development-log-enabled=false
mail.provider=${EMAIL_PROVIDER:ses}
mail.providers.ses.host=${SES_SMTP_HOST:email-smtp.ap-southeast-1.amazonaws.com}
mail.providers.ses.port=${SES_SMTP_PORT:587}
mail.providers.ses.username=${SES_SMTP_USERNAME:}
mail.providers.ses.password=${SES_SMTP_PASSWORD:}
mail.providers.ses.from-address=${SES_MAIL_FROM_ADDRESS:}
mail.providers.resend.host=${RESEND_SMTP_HOST:smtp.resend.com}
mail.providers.resend.port=${RESEND_SMTP_PORT:587}
mail.providers.resend.username=${RESEND_SMTP_USERNAME:resend}
mail.providers.resend.password=${RESEND_SMTP_PASSWORD:}
mail.providers.resend.from-address=${RESEND_MAIL_FROM_ADDRESS:}
management.endpoint.health.show-details=never
server.forward-headers-strategy=framework
