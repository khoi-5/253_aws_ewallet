name: Backend CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - backend/**

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test and build backend
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check whether image already exists in ECR
        id: ecr-image
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if ! image_count="$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'length(images)' \
            --output text)"; then
            echo "Unable to check whether image ${IMAGE_TAG} exists in ECR." >&2
            exit 1
          fi

          if [ "$image_count" = "1" ]; then
            echo "image_exists=true" >> "$GITHUB_OUTPUT"
            echo "Image ${IMAGE_TAG} already exists in ECR; skipping build and push."
          else
            echo "image_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        if: steps.ecr-image.outputs.image_exists != 'true'
        run: >-
          docker build
          --tag "${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}"
          .

      - name: Push Docker image to Amazon ECR
        if: steps.ecr-image.outputs.image_exists != 'true'
        run: >-
          docker push
          "${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}"

      - name: Prepare EC2 User Data
        id: user-data
        env:
          DEPLOY_REGION: ${{ vars.AWS_REGION }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cat > "$RUNNER_TEMP/user-data.sh" <<EOF
          #!/bin/bash
          set -euo pipefail

          aws ecr get-login-password --region "${DEPLOY_REGION}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"
          docker pull "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker rm --force ewallet-backend 2>/dev/null || true
          docker run --detach \
            --name ewallet-backend \
            --restart unless-stopped \
            --publish 8080:8080 \
            --env-file /home/ec2-user/ewallet-backend.env \
            "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          EOF

          user_data_base64="$(base64 --wrap=0 "$RUNNER_TEMP/user-data.sh")"
          echo "base64=$user_data_base64" >> "$GITHUB_OUTPUT"

      - name: Read Launch Template version from Auto Scaling Group
        id: asg-launch-template
        env:
          AUTO_SCALING_GROUP: ${{ vars.AUTO_SCALING_GROUP }}
        run: |
          source_version="$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$AUTO_SCALING_GROUP" \
            --query 'AutoScalingGroups[0].LaunchTemplate.Version' \
            --output text)"

          echo "source_version=$source_version" >> "$GITHUB_OUTPUT"

      - name: Create Launch Template version
        id: create-launch-template-version
        env:
          USER_DATA_BASE64: ${{ steps.user-data.outputs.base64 }}
          LAUNCH_TEMPLATE_ID: ${{ vars.LAUNCH_TEMPLATE_ID }}
          SOURCE_VERSION: ${{ steps.asg-launch-template.outputs.source_version }}
          VERSION_DESCRIPTION: CI deploy ${{ github.sha }}
        run: |
          launch_template_data="$(jq --compact-output --null-input \
            --arg userData "$USER_DATA_BASE64" \
            '{UserData: $userData}')"

          version_number="$(aws ec2 create-launch-template-version \
            --launch-template-id "$LAUNCH_TEMPLATE_ID" \
            --source-version "$SOURCE_VERSION" \
            --version-description "$VERSION_DESCRIPTION" \
            --launch-template-data "$launch_template_data" \
            --query 'LaunchTemplateVersion.VersionNumber' \
            --output text)"

          echo "version_number=$version_number" >> "$GITHUB_OUTPUT"

      - name: Report Launch Template version
        env:
          VERSION_NUMBER: ${{ steps.create-launch-template-version.outputs.version_number }}
        run: |
          echo "Created launch template version: ${VERSION_NUMBER}"

      - name: Update Auto Scaling Group Launch Template version
        env:
          AUTO_SCALING_GROUP: ${{ vars.AUTO_SCALING_GROUP }}
          LAUNCH_TEMPLATE_ID: ${{ vars.LAUNCH_TEMPLATE_ID }}
          NEW_VERSION: ${{ steps.create-launch-template-version.outputs.version_number }}
        run: |
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "$AUTO_SCALING_GROUP" \
            --launch-template "LaunchTemplateId=$LAUNCH_TEMPLATE_ID,Version=$NEW_VERSION"

      - name: Verify Auto Scaling Group Launch Template version
        env:
          AUTO_SCALING_GROUP: ${{ vars.AUTO_SCALING_GROUP }}
          NEW_VERSION: ${{ steps.create-launch-template-version.outputs.version_number }}
        run: |
          actual_version="$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$AUTO_SCALING_GROUP" \
            --query 'AutoScalingGroups[0].LaunchTemplate.Version' \
            --output text)"

          echo "ASG references Launch Template version: ${actual_version}"
          if [ "$actual_version" != "$NEW_VERSION" ]; then
            echo "Expected Launch Template version ${NEW_VERSION}, but ASG references ${actual_version}." >&2
            exit 1
          fi

      - name: Start EC2 Auto Scaling Instance Refresh
        id: instance-refresh
        env:
          AUTO_SCALING_GROUP: ${{ vars.AUTO_SCALING_GROUP }}
          LAUNCH_TEMPLATE_ID: ${{ vars.LAUNCH_TEMPLATE_ID }}
          NEW_VERSION: ${{ steps.create-launch-template-version.outputs.version_number }}
        run: |
          preferences='{"MinHealthyPercentage":0,"MaxHealthyPercentage":100,"InstanceWarmup":300,"SkipMatching":true,"AutoRollback":true}'
          desired_configuration="$(jq --compact-output --null-input \
            --arg launchTemplateId "$LAUNCH_TEMPLATE_ID" \
            --arg version "$NEW_VERSION" \
            '{
              LaunchTemplate: {
                LaunchTemplateId: $launchTemplateId,
                Version: $version
              }
            }')"

          refresh_id="$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$AUTO_SCALING_GROUP" \
            --desired-configuration "$desired_configuration" \
            --preferences "$preferences" \
            --query 'InstanceRefreshId' \
            --output text)"

          echo "instance_refresh_id=$refresh_id" >> "$GITHUB_OUTPUT"
          echo "Started Instance Refresh: ${refresh_id}"

      - name: Wait for Instance Refresh to complete
        env:
          AUTO_SCALING_GROUP: ${{ vars.AUTO_SCALING_GROUP }}
          INSTANCE_REFRESH_ID: ${{ steps.instance-refresh.outputs.instance_refresh_id }}
        run: |
          max_attempts=80
          poll_interval=15

          for attempt in $(seq 1 "$max_attempts"); do
            refresh="$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$AUTO_SCALING_GROUP" \
              --instance-refresh-ids "$INSTANCE_REFRESH_ID" \
              --query 'InstanceRefreshes[0].[Status,PercentageComplete]' \
              --output text)"

            status="$(awk '{print $1}' <<< "$refresh")"
            percentage="$(awk '{print $2}' <<< "$refresh")"
            echo "Instance Refresh status=${status}, percentageComplete=${percentage:-N/A}"

            case "$status" in
              Successful)
                echo "Instance Refresh ${INSTANCE_REFRESH_ID} completed successfully."
                exit 0
                ;;
              Failed|Cancelled|RollbackFailed|RollbackSuccessful)
                echo "Instance Refresh ${INSTANCE_REFRESH_ID} ended with status ${status}." >&2
                exit 1
                ;;
              Pending|InProgress|Cancelling|RollbackInProgress)
                ;;
              None|'')
                echo "Instance Refresh ${INSTANCE_REFRESH_ID} was not found." >&2
                exit 1
                ;;
              *)
                echo "Instance Refresh ${INSTANCE_REFRESH_ID} returned unexpected status ${status}." >&2
                exit 1
                ;;
            esac

            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep "$poll_interval"
            fi
          done

          echo "Instance Refresh ${INSTANCE_REFRESH_ID} did not complete within 20 minutes." >&2
          exit 1

      - name: Verify healthy InService instance
        env:
          AUTO_SCALING_GROUP: ${{ vars.AUTO_SCALING_GROUP }}
        run: |
          aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$AUTO_SCALING_GROUP" \
            --query 'AutoScalingGroups[0].Instances[*].[InstanceId,LifecycleState,HealthStatus]' \
            --output table

          healthy_count="$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$AUTO_SCALING_GROUP" \
            --query "length(AutoScalingGroups[0].Instances[?LifecycleState=='InService' && HealthStatus=='Healthy'])" \
            --output text)"

          if [ "$healthy_count" -lt 1 ]; then
            echo "No InService and Healthy instance was found in the Auto Scaling Group." >&2
            exit 1
          fi

          echo "Verified ${healthy_count} InService and Healthy instance(s)."
